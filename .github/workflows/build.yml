name: build
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json
      - run: dotnet restore -p:Platform=x64
      - run: dotnet build --no-restore -c Release -p:Platform=x64
      - run: dotnet test --project tests/PlainCommander.Core.Tests --no-build -c Release --report-xunit-trx
      - run: dotnet test --project tests/PlainCommander.Presentation.Tests --no-build -c Release --report-xunit-trx
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: test-results
          path: '**/TestResults/*.trx'
